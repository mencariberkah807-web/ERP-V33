services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: artkrilik_erp
      POSTGRES_USER: artkrilik
      POSTGRES_PASSWORD: artkrilik
    ports:
      - "5432:5432"
    volumes:
      - artkrilik_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artkrilik -d artkrilik_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://artkrilik:artkrilik@postgres:5432/artkrilik_erp
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  artkrilik_postgres_data:
